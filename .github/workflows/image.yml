# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline / docs/IMAGE-RELEASE.md.
# zhengxin 参照系 MCP：测试门先行（占位工具空结果带 reason / provenance / 许可门
# 纪律是核心不变量），测试不过不出片。
# 注意：本仓当前为本地仓（无 remote）；TCR secrets 与出片通道在后续波次接通，
# 接通前本 workflow 不会被触发。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business
  IMAGE_NAME: fd-zhengxin-reference
  DOCKERFILE: Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test suite
        run: python -m pytest tests/ -q

  fd-zhengxin-reference:
    needs: test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-zhengxin-reference
      namespace: finddata-business
